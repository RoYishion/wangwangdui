<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>汪汪队 · 每日资金</title>
    <script src="./data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ink: #172033;
        --muted: #6f7b8f;
        --line: #e7ebf2;
        --surface: #ffffff;
        --canvas: #f4f7fb;
        --brand: #1f6feb;
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        padding: 28px clamp(14px, 3vw, 48px) 42px;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      .page-shell {
        width: min(1500px, 100%);
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      h1 {
        color: var(--ink);
        font-size: clamp(24px, 3vw, 34px);
        line-height: 1.15;
        letter-spacing: 0;
      }
      .range-switcher {
        display: inline-flex;
        padding: 4px;
        gap: 3px;
        background: #eaf0f8;
        border-radius: 10px;
        flex-shrink: 0;
      }
      .range-btn {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        padding: 8px 13px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: 0.2s ease;
      }
      .range-btn:hover { color: var(--ink); }
      .range-btn.active {
        background: var(--surface);
        color: var(--brand);
        box-shadow: 0 2px 7px rgba(31, 55, 90, 0.12);
        font-weight: 700;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .summary-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 15px 17px;
        min-width: 0;
      }
      .summary-label { color: var(--muted); font-size: 12px; }
      .summary-value { font-size: 21px; font-weight: 700; margin-top: 7px; }
      .summary-note { color: var(--muted); font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .positive { color: #159a72; }
      .negative { color: #e0525b; }
      .chart-wrap {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 16px;
      }
      .chart-item {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 4px 5px 8px;
        box-shadow: 0 6px 18px rgba(29, 49, 82, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .chart-item:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(29, 49, 82, 0.09); }
      .chart-box { width: 100%; height: 350px; }
      .footer-note { color: #98a2b2; text-align: right; font-size: 12px; margin-top: 18px; }
      @media screen and (max-width: 760px) {
        body { padding: 20px 12px 28px; }
        .topbar { flex-direction: column; margin-bottom: 20px; gap: 15px; }
        .range-switcher { width: 100%; }
        .range-btn { flex: 1; }
        .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
        .chart-wrap { grid-template-columns: 1fr; gap: 12px; }
        .chart-box { height: 310px; }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <h1>汪汪队资金跟踪</h1>
        </div>
        <div class="range-switcher" aria-label="数据范围">
          <button class="range-btn" data-range="20">近20日</button>
          <button class="range-btn active" data-range="60">近60日</button>
          <button class="range-btn" data-range="all">全部</button>
        </div>
      </header>
      <section class="summary" id="summary" aria-label="数据概览"></section>
      <section class="chart-wrap">
      <div class="chart-item">
        <div id="chart_sz50" class="chart-box"></div>
      </div>
      <div class="chart-item">
        <div id="chart_hs300" class="chart-box"></div>
      </div>
      <div class="chart-item">
        <div id="chart_zz1000" class="chart-box"></div>
      </div>
      <div class="chart-item">
        <div id="chart_cy" class="chart-box"></div>
      </div>
      <div class="chart-item">
        <div id="chart_kc50" class="chart-box"></div>
      </div>
      </section>
      <p class="footer-note" id="update-note"></p>
    </main>

    <script>
      const dataList = window.chartData;

      // 指数配置映射
      const indexConfig = [
        {
          key: "sz50",
          domId: "chart_sz50",
          name: "上证50",
          color: "#e63946",
        },
        {
          key: "hs300",
          domId: "chart_hs300",
          name: "沪深300",
          color: "#457b9d",
        },
        {
          key: "zz1000",
          domId: "chart_zz1000",
          name: "中证1000",
          color: "#2a9d8f",
        },
        {
          key: "cy",
          domId: "chart_cy",
          name: "创业板",
          color: "#f77f00",
        },
        {
          key: "kc50",
          domId: "chart_kc50",
          name: "科创50",
          color: "#7209b7",
        },
      ];

      const charts = [];
      let activeRange = 60;

      function getVisibleData() {
        return activeRange === "all" ? dataList : dataList.slice(-activeRange);
      }

      function formatValue(value) {
        return Number(value).toLocaleString("zh-CN", { maximumFractionDigits: 1 });
      }

      function renderSummary() {
        const latest = dataList[dataList.length - 1];
        const previous = dataList[dataList.length - 2];
        const avg = indexConfig.reduce((sum, item) => sum + latest[item.key], 0) / indexConfig.length;
        const strongest = indexConfig.reduce((best, item) => latest[item.key] > latest[best.key] ? item : best, indexConfig[0]);
        document.getElementById("summary").innerHTML = `
          <div class="summary-card"><div class="summary-label">最新交易日</div><div class="summary-value">${latest.date}</div><div class="summary-note">共 ${dataList.length} 个交易日</div></div>
          <div class="summary-card"><div class="summary-label">综合资金强度</div><div class="summary-value ${avg >= 0 ? "positive" : "negative"}">${avg >= 0 ? "+" : ""}${formatValue(avg)}</div><div class="summary-note">五大指数平均值</div></div>
          <div class="summary-card"><div class="summary-label">当前最强指数</div><div class="summary-value" style="color:${strongest.color}">${strongest.name}</div><div class="summary-note">最新值 ${formatValue(latest[strongest.key])}</div></div>`;
        document.getElementById("update-note").textContent = `数据更新至 ${latest.date} · 单位：倍量`;
      }

      function createAllCharts() {
        indexConfig.forEach((config) => {
          const chartDom = document.getElementById(config.domId);
          const myChart = echarts.init(chartDom);
          charts.push({ config, chart: myChart });
          renderChart({ config, chart: myChart });
          window.addEventListener("resize", () => myChart.resize());
        });
      }

      function renderChart({ config, chart }) {
          const visibleData = getVisibleData();
          const seriesData = visibleData.map((item) => item[config.key]);
          const dates = visibleData.map((item) => item.date);

          const option = {
            title: {
              text: config.name,
              left: "center",
              textStyle: { fontSize: 16, fontWeight: 700, color: "#172033" },
            },
            tooltip: {
              trigger: "axis",
              backgroundColor: "rgba(23, 32, 51, .92)",
              borderWidth: 0,
              textStyle: { color: "#fff" },
              formatter: (params) => `日期：${params[0].axisValue}<br/>${config.name}：${formatValue(params[0].data)}`,
            },
            grid: {
              left: "3%",
              right: "4%",
              bottom: "18%",
              containLabel: true,
            },
            dataZoom: [
              {
                type: "slider",
                show: true,
                height: 20,
                xAxisIndex: 0,
                start: 0,
                end: 100,
                zoomLock: false,
                handleStyle: {
                  color: config.color,
                },
              },
              {
                type: "inside",
                xAxisIndex: 0,
                start: 0,
                end: 100,
              },
            ],
            xAxis: {
              type: "category",
              data: dates,
              axisLabel: {
                rotate: 35,
                fontSize: 11,
                color: "#8792a6",
              },
              boundaryGap: true,
            },
            yAxis: {
              type: "value",
              name: "倍量",
              nameTextStyle: { color: "#8792a6", fontSize: 11 },
              axisLabel: { color: "#8792a6" },
              splitLine: { lineStyle: { color: "#edf0f5" } },
            },
            series: [
              {
                name: config.name,
                type: "bar",
                data: seriesData,
                itemStyle: { color: config.color },
                barWidth: "40%",
                label: {
                  show: false,
                  position: "top",
                  fontSize: 10,
                  color: "#333",
                  formatter: "{c}",
                },
              },
            ],
          };

          chart.setOption(option, true);
      }

      document.querySelectorAll(".range-btn").forEach((button) => {
        button.addEventListener("click", () => {
          activeRange = button.dataset.range === "all" ? "all" : Number(button.dataset.range);
          document.querySelectorAll(".range-btn").forEach((item) => item.classList.toggle("active", item === button));
          charts.forEach(renderChart);
        });
      });

      window.addEventListener("load", () => { renderSummary(); createAllCharts(); });
    </script>
  </body>
</html>
